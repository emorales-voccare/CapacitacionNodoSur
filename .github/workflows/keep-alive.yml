name: Keep Render alive

on:
  schedule:
    - cron: '*/10 * * * *'  # every 10 minutes
  workflow_dispatch:         # allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.RENDER_URL }}/api/health")
          echo "Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Warning: received HTTP $STATUS"
            exit 1
          fi
